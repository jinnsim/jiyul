title: Jiyul
description: A calm daily 17×10 sum-to-10 puzzle for iOS — privacy & docs
theme: jekyll-theme-minimal
url: https://jinnsim.github.io
baseurl: /jiyul
plugins:
  - jekyll-default-layout

# Restrict what Jekyll considers content. Everything else under docs/
# (spec, plan, handoff, asset-prompts, etc.) stays out of the public site.
include:
  - privacy.md
  - index.md

# Keep generated site small.
exclude:
  - superpowers
  - spike-manifests
  - screenshots
  - handoff.md
  - asset-prompts.md
  - app-store-metadata.md
