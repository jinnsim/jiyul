name: Tendle
options:
  bundleIdPrefix: com.jinnsim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.2"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: LQZYM2U744
    CODE_SIGN_STYLE: Automatic
targets:
  Tendle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tendle
    info:
      path: Tendle/Info.plist
      properties:
        CFBundleDisplayName: Jiyul
        CFBundleName: Jiyul
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad universal
        ENABLE_PREVIEWS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jinnsim.Tendle
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TendleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TendleTests
      - path: Tendle/Resources/Encouragement.json
        buildPhase: resources
    dependencies:
      - target: Tendle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinnsim.Tendle.tests
        # Test bundles run in the Simulator under the host app's signature.
        # No need for our Apple Development cert; let xcodebuild use the
        # ad-hoc simulator signing path instead of trying to provision a
        # real-device cert for the test target.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
